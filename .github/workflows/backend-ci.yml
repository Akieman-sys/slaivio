name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/sql/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/sql/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slaivio
          POSTGRES_PASSWORD: slaivio
          POSTGRES_DB: slaivio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slaivio -d slaivio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://slaivio:slaivio@localhost:5432/slaivio_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Check critical Python errors
        run: ruff check app scripts tests

      - name: Type check foundation
        run: pyright

      - name: Check application imports
        run: python scripts/check_imports.py

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
